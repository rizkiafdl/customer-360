<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotlight search — reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Theme tokens (OCBC red) ---------- */
:root {
  --bg: #F7F6F5; --surface: #FFFFFF; --surface-subtle: #FAFAF8; --border: #E4E4DF;
  --text: #1D1B1A; --muted: #5E6169;
  --primary: #E2231A; --primary-strong: #9B1B14;
  --sp-scrim: rgba(247,246,245,.30);
  --sp-panel: rgba(255,255,255,.74); --sp-panel-border: rgba(255,255,255,.75);
  --sp-divider: rgba(29,27,26,.08);
  --sp-active-bg: rgba(226,35,26,.09); --sp-active-text: #9B1B14;
  --sp-icon-bg: rgba(29,27,26,.06); --sp-kbd: rgba(29,27,26,.07);
  --sp-shadow: 0 30px 80px rgba(29,27,26,.22), 0 0 0 1px rgba(29,27,26,.06);
}
[data-theme="dark"] {
  --bg: #141414; --surface: #1C1C1C; --surface-subtle: #222222; --border: #2E2E2E;
  --text: #F2F0EE; --muted: #A3A19E;
  --primary: #E2231A; --primary-strong: #FF8A80;
  --sp-scrim: rgba(8,8,8,.45);
  --sp-panel: rgba(38,38,38,.72); --sp-panel-border: rgba(255,255,255,.10);
  --sp-divider: rgba(255,255,255,.08);
  --sp-active-bg: rgba(255,107,97,.16); --sp-active-text: #FFB3AD;
  --sp-icon-bg: rgba(255,255,255,.08); --sp-kbd: rgba(255,255,255,.10);
  --sp-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; }

/* ---------- Demo top bar ---------- */
.topbar { height: 64px; padding: 0 32px; display: flex; align-items: center; gap: 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 10px; }
.brand-badge { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 13px; }
.sp-trigger { flex: 0 1 460px; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 8px 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-subtle); color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
.sp-trigger span.grow { flex: 1; text-align: left; }
.theme-toggle { margin-left: auto; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
.demo { padding: 32px; color: var(--muted); font-size: 14px; }
.demo-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.demo-card { height: 120px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); padding: 18px; color: var(--text); font-weight: 600; }

/* ---------- Spotlight ---------- */
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--sp-kbd); font-size: 12px; font-weight: 600; color: var(--muted); }

.sp-root[hidden] { display: none; }
.sp-scrim { position: fixed; inset: 0; z-index: 1000; background: var(--sp-scrim);
  -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
  animation: spFade .2s ease-out; }
.sp-panel { position: fixed; z-index: 1001; top: 104px; left: 50%; width: min(680px, calc(100vw - 32px));
  transform: translateX(-50%); border-radius: 20px; overflow: hidden;
  background: var(--sp-panel); border: 1px solid var(--sp-panel-border); box-shadow: var(--sp-shadow);
  -webkit-backdrop-filter: blur(32px) saturate(180%); backdrop-filter: blur(32px) saturate(180%);
  animation: spPop .22s cubic-bezier(.2,.8,.2,1); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .sp-scrim { background: rgba(0,0,0,.35); }
  .sp-panel { background: var(--surface); }
}
@keyframes spFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes spPop { from { opacity: 0; transform: translateX(-50%) translateY(-8px) scale(.97); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce) { .sp-scrim, .sp-panel { animation: none; } }

.sp-input-row { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--sp-divider); }
.sp-input-row svg { opacity: .7; flex: none; }
.sp-input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 21px; font-weight: 500; color: var(--text); }
.sp-input::placeholder { color: var(--muted); opacity: .8; }
.sp-esc { min-height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--sp-kbd); color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }

.sp-list { max-height: min(440px, 60vh); overflow-y: auto; padding: 8px 10px 10px; margin: 0; list-style: none; }
.sp-section { padding: 12px 12px 6px; font-size: 12px; font-weight: 600; letter-spacing: .03em; color: var(--muted); }
.sp-option { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border-radius: 12px; cursor: pointer; color: var(--text); transition: background-color .12s ease; }
.sp-icon { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--sp-icon-bg); color: var(--muted); }
.sp-text { flex: 1; min-width: 0; }
.sp-title { display: block; font-size: 15px; font-weight: 600; }
.sp-sub { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-count { flex: none; min-width: 28px; padding: 2px 8px; border-radius: 10px; text-align: center; font-size: 12px; font-weight: 600; background: var(--sp-kbd); color: var(--muted); }
.sp-hint { display: none; flex: none; font-size: 12px; font-weight: 600; color: var(--sp-active-text); }
.sp-option[aria-selected="true"] { background: var(--sp-active-bg); color: var(--sp-active-text); }
.sp-option[aria-selected="true"] .sp-icon { background: var(--primary); color: #fff; }
.sp-option[aria-selected="true"] .sp-count { display: none; }
.sp-option[aria-selected="true"] .sp-hint { display: inline; }
.sp-empty { padding: 28px 12px; text-align: center; font-size: 14px; color: var(--muted); }

.sp-footer { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-top: 1px solid var(--sp-divider); font-size: 12px; color: var(--muted); }
.sp-footer span { display: inline-flex; align-items: center; gap: 6px; }
.sp-footer .right { margin-left: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-badge">360</span>Customer 360</div>
  <button type="button" class="sp-trigger" id="spTrigger" aria-haspopup="dialog" aria-keyshortcuts="Meta+K Control+K">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <span class="grow">Search customer, filter or page</span>
    <span class="kbd" id="spShortcut">⌘K</span>
  </button>
  <button type="button" class="theme-toggle" id="themeToggle">Dark theme</button>
</header>

<main class="demo">
  Demo page content. Click the search bar or press ⌘K / Ctrl+K.
  <div class="demo-grid">
    <div class="demo-card">Total AUM</div><div class="demo-card">Loan exposure</div>
    <div class="demo-card">Opportunities</div><div class="demo-card">KYC note</div>
  </div>
</main>

<!-- ---------- Spotlight markup ---------- -->
<div class="sp-root" id="spRoot" hidden>
  <div class="sp-scrim" id="spScrim"></div>
  <div class="sp-panel" role="dialog" aria-modal="true" aria-label="Search">
    <div class="sp-input-row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <label for="spInput" class="sr-only">Search customers, filters and pages</label>
      <input id="spInput" class="sp-input" type="text" autocomplete="off" spellcheck="false"
        placeholder="Customer ID, opportunity or page"
        role="combobox" aria-expanded="true" aria-controls="spList" aria-autocomplete="list">
      <button type="button" class="sp-esc" id="spClose">esc</button>
    </div>
    <ul class="sp-list" id="spList" role="listbox" aria-label="Results"></ul>
    <div class="sp-footer">
      <span><span class="kbd">↑</span><span class="kbd">↓</span>Navigate</span>
      <span><span class="kbd">↵</span>Open</span>
      <span><span class="kbd">esc</span>Close</span>
      <span class="right">Try typing 87</span>
    </div>
  </div>
</div>

<script>
(() => {
  /* ---------- Sample data (replace with real data source) ---------- */
  const CUSTOMERS = [
    { id: '8797', aum: 'Rp 1,3 M', top: 'Cash-heavy 84%' }, { id: '2759', aum: 'Rp 13 M', top: 'Cash-heavy 91%' },
    { id: '2022', aum: 'Rp 3,7 M', top: 'Cash-heavy 82%' }, { id: '7027', aum: 'Rp 1,4 M', top: 'No REKSA' },
    { id: '7163', aum: 'Rp 1,3 M', top: 'Cash-heavy 83%' }, { id: '2146', aum: 'Rp 423,7 jt', top: 'No REKSA' },
    { id: '6386', aum: 'Rp 420,2 jt', top: 'No ORI' }, { id: '4062', aum: 'Rp 200,7 jt', top: 'No REKSA' },
    { id: '7550', aum: 'Rp 137,6 jt', top: 'No REKSA' }, { id: '4251', aum: 'Rp 244,6 M', top: 'Cash-heavy 99%' },
    { id: '7732', aum: 'Rp 224,4 M', top: 'Cash-heavy 99%' }, { id: '6217', aum: 'Rp 31,8 M', top: 'No ORI' },
    { id: '7170', aum: 'Rp 31,3 M', top: 'Cash-heavy 86%' }, { id: '7903', aum: 'Rp 21,1 M', top: 'No REKSA' }
  ];
  const FILTERS = [
    { label: 'Cash-heavy AUM', count: 12 }, { label: 'No REKSA', count: 29 }, { label: 'No ORI', count: 37 },
    { label: 'No BANCA', count: 29 }, { label: 'High income, no BANCA', count: 6 }, { label: 'No AUM', count: 16 },
    { label: 'With KYC note', count: 43 }
  ];
  const PAGES = [
    { label: 'Portfolio', sub: 'Your book overview', href: '#portfolio' },
    { label: 'Customers', sub: 'Ranked list with preview', href: '#customers' }
  ];
  let recent = ['8797', '2759', '2022'];   // last opened customer IDs

  /* ---------- Icons ---------- */
  const svg = (p) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const ICON = {
    customer: svg('<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>'),
    filter: svg('<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>'),
    page: svg('<path d="M7 7h10v10"/><path d="M7 17 17 7"/>')
  };

  /* ---------- Result builders ---------- */
  const cust = (c) => ({ kind: 'customer', title: `Customer ${c.id}`, sub: `AUM ${c.aum} · ${c.top}`, href: `#customer-${c.id}`, id: c.id });
  const filt = (f) => ({ kind: 'filter', title: f.label, sub: 'Open Customers filtered', count: f.count, href: `#customers?filter=${encodeURIComponent(f.label)}` });
  const page = (p) => ({ kind: 'page', title: p.label, sub: p.sub, href: p.href });

  function buildSections(q) {
    const n = q.trim().toLowerCase();
    if (!n) {
      return [
        { title: 'Recent', items: recent.map((id) => CUSTOMERS.find((c) => c.id === id)).filter(Boolean).map(cust) },
        { title: 'Quick filters', items: [FILTERS[0], FILTERS[1], FILTERS[6]].map(filt) },
        { title: 'Go to', items: PAGES.map(page) }
      ];
    }
    return [
      { title: 'Customers', items: CUSTOMERS.filter((c) => c.id.includes(n)).slice(0, 5).map(cust) },
      { title: 'Filters', items: FILTERS.filter((f) => f.label.toLowerCase().includes(n)).map(filt) },
      { title: 'Pages', items: PAGES.filter((p) => p.label.toLowerCase().includes(n)).map(page) }
    ].filter((s) => s.items.length);
  }

  /* ---------- Elements & state ---------- */
  const root = document.getElementById('spRoot');
  const input = document.getElementById('spInput');
  const list = document.getElementById('spList');
  const trigger = document.getElementById('spTrigger');
  let flat = [], active = 0, lastFocus = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  function render() {
    const sections = buildSections(input.value);
    flat = sections.flatMap((s) => s.items);
    active = Math.min(active, Math.max(flat.length - 1, 0));
    if (!flat.length) {
      list.innerHTML = `<li class="sp-empty" role="presentation">No customer, filter or page matches “${esc(input.value)}”.</li>`;
      input.removeAttribute('aria-activedescendant');
      return;
    }
    let i = 0, html = '';
    for (const s of sections) {
      html += `<li class="sp-section" role="presentation">${esc(s.title)}</li>`;
      for (const it of s.items) {
        const idx = i++;
        html += `<li class="sp-option" role="option" id="sp-opt-${idx}" data-idx="${idx}" aria-selected="${idx === active}">
          <span class="sp-icon">${ICON[it.kind]}</span>
          <span class="sp-text"><span class="sp-title">${esc(it.title)}</span><span class="sp-sub">${esc(it.sub)}</span></span>
          ${it.count != null ? `<span class="sp-count">${it.count}</span>` : ''}
          <span class="sp-hint">↵ Open</span>
        </li>`;
      }
    }
    list.innerHTML = html;
    input.setAttribute('aria-activedescendant', `sp-opt-${active}`);
  }

  function setActive(idx, scroll) {
    if (!flat.length) return;
    active = (idx + flat.length) % flat.length;
    list.querySelectorAll('.sp-option').forEach((el) => el.setAttribute('aria-selected', String(+el.dataset.idx === active)));
    input.setAttribute('aria-activedescendant', `sp-opt-${active}`);
    if (scroll) document.getElementById(`sp-opt-${active}`)?.scrollIntoView({ block: 'nearest' });
  }

  function choose(item) {
    if (!item) return;
    if (item.kind === 'customer') recent = [item.id, ...recent.filter((r) => r !== item.id)].slice(0, 5);
    close();
    // Replace with your router, e.g. router.push(item.href)
    window.location.hash = item.href.replace(/^#/, '');
  }

  function open() {
    if (!root.hidden) return;
    lastFocus = document.activeElement;
    root.hidden = false;
    input.value = '';
    active = 0;
    render();
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => input.focus());
  }

  function close() {
    root.hidden = true;
    document.body.style.overflow = '';
    (lastFocus || trigger).focus();
  }

  /* ---------- Events ---------- */
  trigger.addEventListener('click', open);
  document.getElementById('spScrim').addEventListener('click', close);
  document.getElementById('spClose').addEventListener('click', close);
  input.addEventListener('input', () => { active = 0; render(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1, true); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1, true); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(flat[active]); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'Tab') { e.preventDefault(); } // keep focus inside the dialog
  });
  list.addEventListener('mousemove', (e) => {
    const opt = e.target.closest('.sp-option');
    if (opt && +opt.dataset.idx !== active) setActive(+opt.dataset.idx, false);
  });
  list.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus in the input
  list.addEventListener('click', (e) => {
    const opt = e.target.closest('.sp-option');
    if (opt) choose(flat[+opt.dataset.idx]);
  });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      root.hidden ? open() : close();
    }
  });

  /* Show Ctrl+K on non-Mac */
  if (!/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById('spShortcut').textContent = 'Ctrl K';

  /* Demo theme toggle */
  document.getElementById('themeToggle').addEventListener('click', (e) => {
    const html = document.documentElement;
    const dark = html.dataset.theme !== 'dark';
    html.dataset.theme = dark ? 'dark' : 'light';
    e.currentTarget.textContent = dark ? 'Light theme' : 'Dark theme';
  });
})();
</script>
</body>
</html>
