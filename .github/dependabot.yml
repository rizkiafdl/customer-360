# Weekly, grouped update PRs. The build(deps) prefix keeps the messages
# Conventional Commits, so commitlint passes (docs/adr/0003).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # typescript-eslint accepts only typescript >=4.8.4 <6.1.0, and TypeScript
    # minors can break. Remove this rule when typescript-eslint supports the
    # next TypeScript version.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
