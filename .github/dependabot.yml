# Weekly, grouped update PRs. The build(deps) prefix keeps the messages
# Conventional Commits, so commitlint passes (docs/adr/0003).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
